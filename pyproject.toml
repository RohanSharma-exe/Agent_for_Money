[project]
name = "local-opportunity-agent"
version = "0.1.0"
description = "Local-first AI opportunity research agent for Windows CPU-only machines."
authors = [
    { name = "ROHAN" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.10.0",
    "ollama>=0.6.2",
    "qdrant-client>=1.19.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
local-opportunity-agent = "local_opportunity_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
